server:
  port: ${SERVER_PORT:8081}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos360-catalogo
  # Base de datos Oracle (la misma que usaba application.properties)
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

app:
  rabbitmq:
    catalogo:
      exchange: pedidos360.catalogo.exchange
      queue: pedidos360.catalogo.stock.queue
      routing-key: pedidos360.catalogo.stock
      dlx: pedidos360.catalogo.dlx
      dlq: pedidos360.catalogo.stock.dlq
      dlq-routing-key: pedidos360.catalogo.dlq.key
