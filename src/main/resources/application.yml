server:
  port: ${SERVER_PORT:8081}
  address: 0.0.0.0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-pedidos360-catalogo
  # Base de datos (por defecto H2 en memoria si no se especifica DB_URL de Oracle)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:catalogdb;DB_CLOSE_DELAY=-1;MODE=Oracle}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

app:
  rabbitmq:
    catalogo:
      exchange: pedidos360.catalogo.exchange
      queue: pedidos360.catalogo.stock.queue
      routing-key: pedidos360.catalogo.stock
      dlx: pedidos360.catalogo.dlx
      dlq: pedidos360.catalogo.stock.dlq
      dlq-routing-key: pedidos360.catalogo.dlq.key
